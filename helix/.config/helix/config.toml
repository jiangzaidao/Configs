# Editor Display
theme = "theme"

[editor.cursor-shape]
	insert = "bar"
	normal = "block"
	select = "underline"

[editor.statusline]
	left        = ["mode", "spinner"]
	center      = ["file-name"]
	right       = ["diagnostics", "position", "file-type"]
	separator   = "│"
	mode.normal = "NORMAL"
	mode.insert = "INSERT"
	mode.select = "SELECT"
	diagnostics = ["warning", "error"]
